name: Notificador Tareas Eminus

on:
  schedule:
    - cron: '0 0,3,12,18,21 * * *'
  workflow_dispatch:

jobs:
  revisar_eminus:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Requests y Selenium
        run: pip install requests selenium

      - name: Ejecutar Script de Extracción
        env:
          EMINUS_USER: ${{ secrets.EMINUS_USER }}
          EMINUS_PASS: ${{ secrets.EMINUS_PASS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMINUS_MATERIAS: ${{ secrets.EMINUS_MATERIAS }}
        run: python tareas-eminus-bot.py